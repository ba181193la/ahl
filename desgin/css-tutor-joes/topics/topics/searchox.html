<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        width: 100vw;
        height: 100vh;
        background-color: rgb(203, 194, 194);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
    }
    h1{
        font-weight: 400;
        font-size: 20px;
        text-transform: uppercase;
        color: orangered;
    }
    .search-bar{
        max-width: 300px;
        display: inline-flex;
        background-color: blue;
        width: 1200px;
    }
    .search-text{
        padding: 10px;
        width: 75%;
        outline: none;
        border: 1px solid rgb(255, 86, 24);
        border-radius: 5px 0 0 5px;
        transition: 0.5s;
        background-color: rgba(18, 14, 13);

    }
    .search-text::placeholder{
        color: rgb(255, 86, 24);
    }
    .btn-search{
        border: none;
        outline: none;
        width: 25%;
        background-color: rgb(255, 86, 24);
    }
</style>
<body>
    <h1>search box</h1>
    <div class="search-bar">
    <input type="text" class="search-text" placeholder="search box">
    <button class="btn-search">
    <i class="fa fa-search"></i>
</button>
</div>
</body>
</html>
